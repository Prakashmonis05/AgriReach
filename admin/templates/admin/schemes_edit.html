<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Scheme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-yellow-600 text-white p-4 shadow">
        <h1 class="text-xl font-semibold">Edit Scheme - {{ scheme.name }}</h1>
    </header>

    <div class="p-6 max-w-4xl mx-auto bg-white shadow rounded">

        <form method="POST">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <div>
                    <label class="font-semibold">Scheme Name</label>
                    <input name="name" value="{{ scheme.name }}" required class="w-full border p-2 rounded" />
                </div>

                <div>
                    <label class="font-semibold">Launch Year</label>
                    <input name="launch_year" type="number" value="{{ scheme.launch_year }}" required class="w-full border p-2 rounded" />
                </div>

                <div>
                    <label class="font-semibold">Ministry</label>
                    <input name="ministry" value="{{ scheme.ministry }}" required class="w-full border p-2 rounded" />
                </div>

                <div>
                    <label class="font-semibold">Type</label>
                    <input name="type" value="{{ scheme.type }}" required class="w-full border p-2 rounded" />
                </div>

                <div>
                    <label class="font-semibold">Status</label>
                    <input name="status" value="{{ scheme.status }}" required class="w-full border p-2 rounded" />
                </div>

                <div>
                    <label class="font-semibold">Category</label>
                    <input name="category" value="{{ scheme.category }}" required class="w-full border p-2 rounded" />
                </div>

            </div>

            <div class="mt-4">
                <label class="font-semibold">Objective</label>
                <textarea name="objective" rows="3" required class="w-full border p-2 rounded">{{ scheme.objective }}</textarea>
            </div>

            <div class="mt-4">
                <label class="font-semibold">Benefits</label>
                <textarea name="benefit" rows="3" required class="w-full border p-2 rounded">{{ scheme.benefit }}</textarea>
            </div>

            <div class="mt-4">
                <label class="font-semibold">Eligibility</label>
                <textarea name="eligibility" rows="3" required class="w-full border p-2 rounded">{{ scheme.eligibility }}</textarea>
            </div>

            <div class="mt-6 flex justify-between">
                <a href="{{ url_for('admin.admin_schemes') }}" class="px-4 py-2 bg-gray-500 text-white rounded">
                    Back
                </a>

                <button type="submit"
                        class="px-4 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700">
                    Update Scheme
                </button>
            </div>

        </form>

    </div>

</body>
</html>
