<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Scheme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 min-h-screen">

<header class="bg-gradient-to-r from-amber-600 to-orange-600 text-white p-6 shadow-lg">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold tracking-tight">
            Edit Scheme – {{ scheme.name }}
        </h1>
        <p class="text-amber-100 text-sm mt-1">Update scheme details and information</p>
    </div>
</header>

<div class="p-6 max-w-4xl mx-auto">
    <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-amber-100">
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-4">
            <h2 class="text-white font-semibold text-lg">Scheme Information</h2>
        </div>
        
        <form method="POST" class="p-8 space-y-6">

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Scheme Name</label>
                <input name="name" value="{{ scheme.name }}" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">State</label>
                    <input name="state" value="{{ scheme.state or '' }}" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all outline-none">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Category</label>
                    <input name="category" value="{{ scheme.category or '' }}" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all outline-none">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Description</label>
                <textarea name="description" rows="4" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all outline-none resize-none">{{ scheme.description or '' }}</textarea>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Source</label>
                <input name="source" value="{{ scheme.source }}" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all outline-none">
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Scheme URL</label>
                <input name="scheme_url" value="{{ scheme.scheme_url }}" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all outline-none">
            </div>

            <div class="pt-4 flex gap-3">
                <button type="submit" class="flex-1 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-700 hover:to-orange-700 text-white font-semibold px-6 py-3 rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 transform hover:-translate-y-0.5">
                    Update Scheme
                </button>
                <button
  type="button"
  onclick="window.location.href='/admin/schemes'"
  class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
  Cancel
</button>

            </div>

        </form>
    </div>
</div>

</body>
</html>
