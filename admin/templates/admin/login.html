<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-input {
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-input:focus {
            border-color: #333;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .login-btn {
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .login-btn:hover {
            background-color: #000;
        }

        .login-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body class="flex justify-center items-center h-screen">

    <div class="login-container bg-white shadow-lg p-8 rounded-lg w-96">
        <h2 class="text-2xl font-semibold mb-6 text-center text-gray-800">Admin Login</h2>

        <form method="POST">
            <input type="text" name="username" placeholder="Username"
                   class="form-input w-full p-3 border border-gray-300 rounded-md mb-4 focus:outline-none" required>

            <input type="password" name="password" placeholder="Password"
                   class="form-input w-full p-3 border border-gray-300 rounded-md mb-5 focus:outline-none" required>

            <button class="login-btn w-full bg-gray-800 text-white p-3 rounded-md font-medium">
                Login
            </button>
        </form>
    </div>

</body>
</html>
