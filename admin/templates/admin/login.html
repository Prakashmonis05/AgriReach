<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

    <form method="POST" class="bg-white shadow p-6 rounded w-96">
        <h2 class="text-2xl font-bold mb-4 text-center">Admin Login</h2>

        <input type="text" name="username" placeholder="Username"
               class="w-full p-2 border rounded mb-3" required>

        <input type="password" name="password" placeholder="Password"
               class="w-full p-2 border rounded mb-4" required>

        <button class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
            Login
        </button>
    </form>

</body>
</html>
