<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Government Schemes - AgriReach</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .card-hover {
            transition: all 0.25s ease;
        }

        .card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 22px rgba(0,0,0,0.12);
        }
    </style>
</head>

<body class="bg-gray-100">

{% include 'navbar.html' %}

<!-- HEADER -->
<header class="py-12 bg-gradient-to-r from-green-600 to-green-700 text-white text-center shadow">
    <h1 class="text-4xl font-bold mb-3">Government Schemes</h1>
    <p class="text-lg opacity-90">
        Browse verified government schemes for farmers and citizens
    </p>
</header>

<!-- MAIN -->
<div class="max-w-7xl mx-auto px-4 md:px-8 py-10">

    <!-- Search -->
    <div class="flex justify-center mb-10">
        <input id="searchBox"
               type="text"
               placeholder="Search by scheme name, state, category…"
               class="border p-3 w-full md:w-1/2 rounded-xl shadow focus:ring-2 focus:ring-green-500 outline-none"
               onkeyup="searchSchemes()" />
    </div>

    <!-- Loader -->
    <p id="loader" class="text-center text-lg font-semibold mt-6 text-gray-700">
        Loading schemes…
    </p>

    <!-- Cards -->
    <div id="schemesContainer"
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-6">
    </div>
</div>

<!-- JS -->
<script>
const container = document.getElementById("schemesContainer");
const loader = document.getElementById("loader");
let schemesData = [];

async function loadSchemes() {
    try {
        const response = await fetch("/api/schemes");
        const json = await response.json();
        schemesData = json.data || [];
        loader.style.display = "none";
        displaySchemes(schemesData);
    } catch (err) {
        loader.innerText = "Failed to load schemes.";
        console.error(err);
    }
}

function displaySchemes(data) {
    container.innerHTML = "";

    if (data.length === 0) {
        container.innerHTML = `
            <div class="col-span-3 text-center text-gray-600 text-xl">
                No schemes found.
            </div>`;
        return;
    }

    data.forEach(scheme => {
        container.innerHTML += `
        <div class="bg-white p-6 rounded-xl shadow card-hover border border-gray-200 flex flex-col justify-between">

            <div>
                <h2 class="text-xl font-semibold text-green-700 mb-2">
                    ${scheme.name}
                </h2>

                <p class="text-sm text-gray-500 mb-3">
                    ${scheme.state} • ${scheme.category}
                </p>

                <p class="text-gray-700 text-sm leading-relaxed">
                    ${scheme.description
                        ? scheme.description.substring(0, 140) + "..."
                        : "Description not available."}
                </p>
            </div>

            <div class="mt-4 flex items-center justify-between text-sm">
                <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full font-medium">
                    Source: ${scheme.source}
                </span>

                <a href="${scheme.scheme_url}"
                   target="_blank"
                   class="text-green-700 font-semibold hover:underline">
                    View Details →
                </a>
            </div>
        </div>`;
    });
}

function searchSchemes() {
    const q = document.getElementById("searchBox").value.toLowerCase();

    const filtered = schemesData.filter(s =>
        s.name.toLowerCase().includes(q) ||
        (s.category && s.category.toLowerCase().includes(q)) ||
        (s.state && s.state.toLowerCase().includes(q)) ||
        (s.description && s.description.toLowerCase().includes(q))
    );

    displaySchemes(filtered);
}

loadSchemes();
</script>

</body>
</html>
